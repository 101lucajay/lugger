<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lugger · Anmelden</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand">
      <span class="logo">◆</span>
      <div><div class="brand-name">LUGGER</div><div class="brand-sub">Agenten-Zentrale</div></div>
    </div>
    <input type="password" name="password" placeholder="Passwort" autofocus required>
    <button class="btn primary" type="submit">Anmelden</button>
    <p class="err" id="err" hidden>Falsches Passwort.</p>
  </form>
  <script>if (location.search.includes("error")) document.getElementById("err").hidden = false;</script>
</body>
</html>
